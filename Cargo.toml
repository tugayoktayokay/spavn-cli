[package]
name = "spavn"
version = "0.1.0"
edition = "2021"
description = "SPAVN v0.1 (spavn.dev) — High-performance native Rust coding agent and harness"

[[bin]]
name = "spavn"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
