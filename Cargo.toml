[package]
name = "spavn"
version = "0.2.16"
edition = "2021"
description = "Terminal-native coding agent that ships as one Rust binary: no async runtime, three direct dependencies"
license = "MIT"
homepage = "https://spavn.dev"
documentation = "https://github.com/tugayoktayokay/spavn-cli#readme"
repository = "https://github.com/tugayoktayokay/spavn-cli"
readme = "README.md"
rust-version = "1.80"
keywords = ["ai", "agent", "cli", "tui", "coding-agent"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Tugay Oktay Okay"]
# The screenshots and CI config stay on GitHub. The README links them by absolute URL, so
# crates.io and docs.rs render the same page from a ~90 KiB crate.
exclude = ["assets/", ".github/", "packaging/", "evals/"]

[[bin]]
name = "spavn"
path = "src/main.rs"

[[bin]]
name = "spavn-eval"
path = "src/bin/spavn_eval.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
