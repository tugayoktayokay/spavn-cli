name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `search` and `glob` shell out to `rg`; the README lists it as a requirement, so CI has to
      # provide it or those tests only ever assert the "binary missing" path.
      - name: Install ripgrep
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          else
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - if: runner.os != 'Windows'
        run: cargo test --all-targets --all-features
      - run: cargo build --release --bin spavn
      - name: Smoke-run release binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./target/release/spavn.exe --version
            ./target/release/spavn.exe --help >/dev/null
          else
            ./target/release/spavn --version
            ./target/release/spavn --help >/dev/null
          fi
