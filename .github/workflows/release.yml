name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            archive: spavn-aarch64-apple-darwin.tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: spavn-x86_64-apple-darwin.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: spavn-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: spavn-aarch64-unknown-linux-gnu.tar.gz
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: spavn-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build release binary
        run: >-
          cargo build --release --target ${{ matrix.target }}
          ${{ matrix.linker && format('--config target.{0}.linker="{1}"', matrix.target, matrix.linker) || '' }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          tar -czf ${{ matrix.archive }} -C target/${{ matrix.target }}/release spavn
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/spavn.exe -DestinationPath ${{ matrix.archive }}
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.archive }}).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii -NoNewline ${{ matrix.archive }}.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  # Keeps homebrew-tap in lockstep with the tag. Skipped (not failed) when the tap token is absent,
  # so a release never breaks just because a repository secret was never configured.
  tap:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync formula into the tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::TAP_GITHUB_TOKEN is unset — skipping the tap update."
            exit 0
          fi
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/tugayoktayokay/homebrew-tap.git" tap
          sh packaging/homebrew/sync-tap.sh "${GITHUB_REF_NAME#v}" tap
